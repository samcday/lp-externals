[package]
name = "lp-externals"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.38", features = ["derive"] }
gosh-dl = { version = "0.4.0", default-features = false, features = ["http"] }
reqwest = { version = "0.12.23", features = ["blocking", "json", "stream"] }
rusb = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
