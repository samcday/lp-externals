[package]
name = "lp-externals"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "lp-externals"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
alloc = []
std = ["alloc", "anyhow/std", "crc32fast/std", "sha2/std"]
cli = [
    "std",
    "dep:clap",
    "dep:flate2",
    "dep:gosh-dl",
    "dep:hadris-fat",
    "dep:lzma-rs",
    "dep:regf",
    "dep:reqwest",
    "dep:roxmltree",
    "roxmltree/std",
    "dep:rusb",
    "dep:serde",
    "serde/std",
    "dep:serde_json",
    "serde_json/std",
    "dep:sha1",
    "dep:tokio",
    "dep:xz2",
    "dep:zip",
]

[dependencies]
anyhow = { version = "1.0.98", default-features = false }
clap = { version = "4.5.38", optional = true, features = ["derive"] }
crc32fast = { version = "1.4.2", default-features = false }
flate2 = { version = "1.1.9", optional = true }
gosh-dl = { version = "0.4.0", optional = true, default-features = false, features = ["http"] }
hadris-fat = { version = "1.1.2", optional = true }
lzma-rs = { version = "0.3.0", optional = true }
regf = { version = "0.1.0", optional = true }
reqwest = { version = "0.12.23", optional = true, features = ["blocking", "json", "stream"] }
roxmltree = { version = "0.21.1", optional = true, default-features = false }
rusb = { version = "0.9.4", optional = true }
serde = { version = "1.0.228", optional = true, default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.145", optional = true, default-features = false, features = ["alloc"] }
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.10.9", default-features = false }
tokio = { version = "1.49.0", optional = true, features = ["rt-multi-thread", "macros", "time"] }
xz2 = { version = "0.1.7", optional = true }
zip = { version = "4.6.1", optional = true, default-features = false, features = ["deflate"] }
